name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Regras do repositório
        run: bash scripts/check-repo.sh
      - name: Pacotes
        # npm ci falha quando o package.json mudou e o package-lock.json não acompanhou
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Casos
        run: npm run validar
      - name: Casos revisados para publicar
        # na release para a main, o jogo publicado precisa ter pelo menos um caso revisado
        if: github.base_ref == 'main'
        run: npm run validar -- --publicar
      - name: Testes
        run: npm test
      - name: Build
        # o build roda tsc -b antes do vite build, então também checa os tipos
        run: npm run build
      - name: Navegador do Playwright
        run: npx playwright install --with-deps chromium
      - name: Jogar os casos de teste
        # celular em pé e PC, contra o servidor de desenvolvimento que o próprio Playwright sobe
        run: npm run e2e

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # o gitleaks lista os commits do PR
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
